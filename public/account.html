<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Account — akn.id</title>
<link rel="icon" href="https://akn.me.uk/favicon.ico">
<link rel="stylesheet" href="/akn.css">
<style>
/* Page-specific only. Tokens, shell, cards, fields, buttons and badges all come
   from akn.css, which holds the same values this file used to declare inline. */
.provider-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--card-border); }
.provider-row:last-child { border-bottom: none; padding-bottom: 0; }
.provider-info { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.provider-dot { width: 8px; height: 8px; border-radius: 50%; }
.dot-linked { background: #6ee7b7; }
.dot-unlinked { background: var(--card-border); }
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="topbar">
  <div class="topbar-left">
    <a class="wordmark" href="https://akn.me.uk">
      <img src="https://akn.me.uk/android-chrome-192x192.png" alt="">
      <span>akn.id</span>
    </a>
    <nav class="nav">
      <a href="/account" aria-current="page">Account</a>
      <a href="/card">Card</a>
      <a href="/admin" id="nav-admin" hidden>Admin</a>
    </nav>
  </div>
  <div class="topbar-right">
    <div id="avatar-wrap"></div>
    <button class="signout-btn" id="btn-signout">Sign Out</button>
  </div>
</div>

<div class="page" id="page" style="display:none">
  <h1 id="greeting">My Account</h1>
  <div class="page-sub" id="account-email"></div>

  <!-- Status & Projects -->
  <div class="section">
    <div class="section-title">Access</div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <span id="status-badge" class="badge"></span>
      </div>
      <div id="projects-wrap">
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">Projects</div>
        <div id="projects-list"></div>
      </div>
    </div>
  </div>

  <!-- Profile -->
  <div class="section">
    <div class="section-title">Profile</div>
    <div class="card">
      <div class="field-row">
        <div class="field"><label>Display Name</label><input type="text" id="f-name" placeholder="Your name" /></div>
        <div class="field"><label>Username / Handle</label><input type="text" id="f-handle" placeholder="@handle" /></div>
      </div>
      <div class="field"><label>Bio</label><textarea id="f-bio" placeholder="A short bio"></textarea></div>
      <div class="field-row">
        <div class="field"><label>Location</label><input type="text" id="f-location" placeholder="City, Country" /></div>
        <div class="field"><label>Website</label><input type="url" id="f-website" placeholder="https://" /></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Date of Birth</label><input type="date" id="f-dob" /></div>
        <div class="field"><label>Occupation</label><input type="text" id="f-occupation" placeholder="What do you do?" /></div>
      </div>
    </div>
  </div>

  <!-- Contact -->
  <div class="section">
    <div class="section-title">Contact</div>
    <div class="card">
      <div class="field"><label>Email</label><input type="email" id="f-email" readonly /></div>
      <div class="field"><label>Phone</label><input type="tel" id="f-phone" placeholder="+44 7700 000000" /></div>
    </div>
  </div>

  <!-- Social -->
  <div class="section">
    <div class="section-title">Social</div>
    <div class="card">
      <div class="field-row">
        <div class="field"><label>Twitter / X</label><input type="text" id="f-twitter" placeholder="@username" /></div>
        <div class="field"><label>Instagram</label><input type="text" id="f-instagram" placeholder="@username" /></div>
      </div>
      <div class="field-row">
        <div class="field"><label>GitHub</label><input type="text" id="f-github" placeholder="username" /></div>
        <div class="field"><label>LinkedIn</label><input type="text" id="f-linkedin" placeholder="profile URL or handle" /></div>
      </div>
    </div>
  </div>

  <!-- Preferences -->
  <div class="section">
    <div class="section-title">Preferences</div>
    <div class="card">
      <div class="field-row">
        <div class="field"><label>Language</label>
          <select id="f-lang">
            <option value="en">English</option>
            <option value="ur">Urdu</option>
            <option value="fr">French</option>
            <option value="ar">Arabic</option>
          </select>
        </div>
        <div class="field"><label>Timezone</label><input type="text" id="f-tz" placeholder="Europe/London" /></div>
      </div>
    </div>
  </div>

  <div class="save-row">
    <button class="btn" id="btn-save">Save Changes</button>
    <span class="save-msg" id="save-msg"></span>
  </div>

  <!-- Sign-in methods -->
  <div class="section" style="margin-top:32px">
    <div class="section-title">Sign-in Methods</div>
    <div class="card" id="providers-list"></div>
    <!-- Invisible reCAPTCHA anchor for phone linking. Firebase requires a real
         element in the DOM before linkWithPhoneNumber will send an SMS. -->
    <div id="recaptcha-holder"></div>
  </div>

  <!-- Danger zone -->
  <div class="section">
    <div class="section-title">Account</div>
    <div class="card" style="display:flex;gap:12px;flex-wrap:wrap">
      <button class="btn btn-danger" id="btn-delete">Delete Account</button>
    </div>
  </div>
</div>

<div class="loading" id="loading">Loading…</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import {
  getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, OAuthProvider,
  linkWithPopup, linkWithRedirect, getRedirectResult, unlink, deleteUser,
  RecaptchaVerifier, linkWithPhoneNumber,
} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
import {
  getFirestore, doc, getDoc, setDoc, serverTimestamp,
} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyDLWVxNsZveffKUaf07mRlrlouM_gyocmI",
  authDomain: "aknid-me-uk.firebaseapp.com",
  projectId: "aknid-me-uk",
  storageBucket: "aknid-me-uk.firebasestorage.app",
  messagingSenderId: "903162243588",
  appId: "1:903162243588:web:053d5c3a06c0fb23ee6351",
});
const auth = getAuth(app);
const db = getFirestore(app);

// Linking here is what makes one human ONE account. Each provider produces a
// different Firebase uid, and akn-api's identifier index only merges on an
// identifier the user has PROVEN control of — so a brand-new sign-in with an
// unseen phone or LinkedIn account resolves to nobody and would become a second
// person. Linking from an already-signed-in session attaches the new identifier
// to the SAME uid, which is the only safe way to converge them.
const PROVIDERS = [
  { id: 'google.com', label: 'Google', Provider: GoogleAuthProvider },
  { id: 'apple.com', label: 'Apple', Provider: () => new OAuthProvider('apple.com') },
  { id: 'linkedin.com', label: 'LinkedIn', Provider: () => new OAuthProvider('linkedin.com') },
  { id: 'password', label: 'Email / Password', Provider: null },
  // Phone cannot use linkWithPopup — it needs a reCAPTCHA and an SMS round trip,
  // so it has its own handler below rather than a Provider constructor.
  { id: 'phone', label: 'Phone Number', Provider: null, link: 'phone' },
];

// Collect the outcome of a linkWithRedirect before anything else renders.
// Without this the user comes back from the provider to a page that silently
// looks unchanged, whether the link succeeded or failed.
getRedirectResult(auth).catch(e => {
  if (!e?.code) return;
  alert(e.code === 'auth/credential-already-in-use'
    ? 'That account is already linked to a different akn ID account.'
    : e.code === 'auth/operation-not-allowed'
      ? 'That provider is not configured yet — add its client ID and secret to Firebase Authentication first.'
      : e.message);
});

onAuthStateChanged(auth, async user => {
  if (!user) { location.href = '/'; return; }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('page').style.display = '';

  // Avatar
  const avatarWrap = document.getElementById('avatar-wrap');
  if (user.photoURL) {
    avatarWrap.innerHTML = `<img class="avatar" src="${user.photoURL}" alt="">`;
  } else {
    const initial = (user.displayName || user.email || '?')[0].toUpperCase();
    avatarWrap.innerHTML = `<div class="avatar-placeholder">${initial}</div>`;
  }

  // Profile fields still live in users/{uid}; access does NOT.
  //
  // Status, role and projects belong to the PERSON, and a person is reached
  // through identities/ or the verified identifier index — not through a
  // per-uid document. Reading them from users/{uid} showed "pending / no
  // projects" for every sign-in method whose uid is not a plain Firebase
  // provider uid (Zitadel, Steam, email OTP), even for an approved admin.
  // Same bug the login page had.
  const snap = await getDoc(doc(db, 'users', user.uid));
  const data = snap.exists() ? snap.data() : {};

  try {
    const idToken = await user.getIdToken();
    const res = await fetch('https://api.akn.me.uk/auth/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ idToken, project: 'halcyon' }),
    });
    if (res.ok) {
      const v = await res.json();
      data.status = v.approved ? 'approved' : (v.reason || 'pending');
      data.projects = v.projects ?? data.projects;
      data.role = v.role ?? data.role;
      if (v.name && !data.displayName) data.displayName = v.name;
      if (v.email) data.email = v.email;
    }
  } catch { /* fall back to whatever users/{uid} had */ }

  // Header
  document.getElementById('greeting').textContent = data.displayName || user.displayName || 'My Account';
  document.getElementById('account-email').textContent = user.email || user.phoneNumber || '';

  // Status badge
  const badge = document.getElementById('status-badge');
  badge.textContent = data.status || 'pending';
  badge.className = `badge badge-${data.status === 'approved' ? 'approved' : 'pending'}`;

  // Admin link. It lives in the nav now rather than inline beside the status
  // badge, so it sits in the same place on every page instead of only this one.
  if (data.role === 'admin') {
    document.getElementById('nav-admin').hidden = false;
  }

  // Projects
  const projects = data.projects || [];
  const pl = document.getElementById('projects-list');
  pl.innerHTML = projects.length
    ? projects.map(p => `<span class="project-chip">${p}</span>`).join('')
    : '<span style="font-size:12px;color:var(--text-muted)">No projects assigned</span>';

  // Fill form
  const f = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };
  f('f-name', data.displayName || user.displayName);
  f('f-handle', data.handle);
  f('f-bio', data.bio);
  f('f-location', data.location);
  f('f-website', data.website);
  f('f-dob', data.dob);
  f('f-occupation', data.occupation);
  f('f-email', user.email);
  f('f-phone', user.phoneNumber || data.phone);
  f('f-twitter', data.social?.twitter);
  f('f-instagram', data.social?.instagram);
  f('f-github', data.social?.github);
  f('f-linkedin', data.social?.linkedin);
  f('f-lang', data.preferences?.language || 'en');
  f('f-tz', data.preferences?.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone);

  // Providers
  const linked = user.providerData.map(p => p.providerId);
  const pl2 = document.getElementById('providers-list');
  pl2.innerHTML = PROVIDERS.map(p => `
    <div class="provider-row">
      <div class="provider-info">
        <span class="provider-dot ${linked.includes(p.id) ? 'dot-linked' : 'dot-unlinked'}"></span>
        ${p.label}
      </div>
      ${(p.Provider || p.link === 'phone') && !linked.includes(p.id)
        ? `<button class="btn" onclick="${p.link === 'phone' ? 'linkPhone()' : `linkProvider('${p.id}')`}">Link</button>`
        : linked.includes(p.id) && linked.length > 1 && p.Provider
          ? `<button class="btn btn-danger" onclick="unlinkProvider('${p.id}')">Unlink</button>`
          : `<span style="font-size:12px;color:var(--text-muted)">${linked.includes(p.id) ? 'Active' : '—'}</span>`
      }
    </div>
  `).join('');

  // Save
  document.getElementById('btn-save').addEventListener('click', async () => {
    const btn = document.getElementById('btn-save');
    const msg = document.getElementById('save-msg');
    btn.disabled = true; msg.textContent = '';
    const g = id => document.getElementById(id).value.trim();
    try {
      await setDoc(doc(db, 'users', user.uid), {
        displayName: g('f-name') || null,
        handle: g('f-handle') || null,
        bio: g('f-bio') || null,
        location: g('f-location') || null,
        website: g('f-website') || null,
        dob: g('f-dob') || null,
        occupation: g('f-occupation') || null,
        phone: g('f-phone') || null,
        social: {
          twitter: g('f-twitter') || null,
          instagram: g('f-instagram') || null,
          github: g('f-github') || null,
          linkedin: g('f-linkedin') || null,
        },
        preferences: {
          language: g('f-lang') || 'en',
          timezone: g('f-tz') || null,
        },
        updatedAt: serverTimestamp(),
      }, { merge: true });
      msg.textContent = 'Saved';
      setTimeout(() => msg.textContent = '', 3000);
    } catch (e) { msg.textContent = 'Error saving'; msg.style.color = '#fca5a5'; }
    btn.disabled = false;
  });
});

window.linkProvider = async (id) => {
  const user = auth.currentUser;
  try {
    const p = id === 'google.com' ? new GoogleAuthProvider() : new OAuthProvider(id);
    try {
      await linkWithPopup(user, p);
    } catch (e) {
      // Popups are blocked by default in several browsers and in embedded
      // webviews, and iOS Safari closes them unpredictably. Redirect always
      // works; it just costs a page load. Fall back rather than dead-ending.
      if (['auth/popup-blocked', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request',
           'auth/operation-not-supported-in-this-environment'].includes(e.code)) {
        await linkWithRedirect(user, p);
        return; // navigating away; the result is picked up on return
      }
      throw e;
    }
    location.reload();
  } catch (e) {
    // operation-not-allowed means the provider exists in Firebase but has no
    // credentials yet — worth saying plainly instead of showing the raw SDK text.
    alert(e.code === 'auth/operation-not-allowed'
      ? `${id} is not configured yet — add its client ID and secret to Firebase Authentication first.`
      : e.code === 'auth/credential-already-in-use'
        ? `That ${id} account is already linked to a different akn ID account.`
        : e.message);
  }
};
// Phone linking: reCAPTCHA -> SMS -> code. linkWithPhoneNumber attaches the
// number to the CURRENT uid rather than creating a new user, which is the whole
// point — afterwards, signing in by phone resolves to this same person.
let recaptcha = null;
window.linkPhone = async () => {
  const user = auth.currentUser;
  const number = (prompt('Mobile number in full international format, e.g. +447700900000') || '').trim();
  if (!number) return;
  if (!/^\+[1-9]\d{6,14}$/.test(number)) {
    alert('That is not a valid E.164 number. It must start with + and the country code.');
    return;
  }
  try {
    // One verifier per page: re-creating it on a second attempt throws
    // "reCAPTCHA has already been rendered in this element".
    if (!recaptcha) {
      recaptcha = new RecaptchaVerifier(auth, 'recaptcha-holder', { size: 'invisible' });
      await recaptcha.render();
    }
    const confirmation = await linkWithPhoneNumber(user, number, recaptcha);
    const code = (prompt(`Enter the 6-digit code sent to ${number}`) || '').trim();
    if (!code) return;
    await confirmation.confirm(code);
    location.reload();
  } catch (e) {
    // A failed attempt leaves the verifier in a state that rejects the next one.
    try { recaptcha?.clear(); } catch {}
    recaptcha = null;
    alert(e.code === 'auth/credential-already-in-use'
      ? 'That number is already linked to a different akn ID account.'
      : e.message);
  }
};
window.unlinkProvider = async (id) => {
  if (!confirm(`Unlink ${id}?`)) return;
  try { await unlink(auth.currentUser, id); location.reload(); }
  catch (e) { alert(e.message); }
};

document.getElementById('btn-signout').addEventListener('click', () =>
  signOut(auth).then(() => location.href = '/')
);
document.getElementById('btn-delete').addEventListener('click', async () => {
  if (!confirm('Permanently delete your account? This cannot be undone.')) return;
  try { await deleteUser(auth.currentUser); location.href = '/'; }
  catch (e) { alert('Re-authenticate and try again: ' + e.message); }
});
</script>
</body>
</html>
